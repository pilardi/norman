version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - govet
    - unused
    - misspell
    - unconvert
    - copyloopvar
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*net/http.Response).Body.Close
        - fmt.Fprint
        - fmt.Fprintf
        - os.Unsetenv
        - (encoding/json.Decoder).Decode
    staticcheck:
      checks: ["all", "-ST1003", "-ST1020", "-ST1021"]

formatters:
  enable:
    - gofmt
    - goimports
