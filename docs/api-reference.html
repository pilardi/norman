      <body>
        <script id="api-reference" type="application/json" data-configuration="{&quot;cdn&quot;:&quot;https://cdn.jsdelivr.net/npm/@scalar/api-reference&quot;,&quot;layout&quot;:&quot;modern&quot;,&quot;specUrl&quot;:&quot;file:///home/pablo/workspaces/norman/api-spec.yaml&quot;,&quot;specContent&quot;:&quot;openapi: \&quot;3.1.0\&quot;\ninfo:\n  title: \&quot;Norman Agent Server API\&quot;\n  description: |\n    Client ↔ Agent Server communication protocol for the Norman agent system.\n    Designed to drive code generation for client protocol libraries and server handlers.\n  version: \&quot;0.2.0\&quot;\n  contact:\n    name: \&quot;norman project\&quot;\n\nservers:\n  - url: \&quot;http://localhost:8080\&quot;\n    description: \&quot;Default Agent Server endpoint\&quot;\n\ntags:\n  - name: workspace\n    description: Workspace lifecycle management\n  - name: session\n    description: Chat session management (messages, history, status)\n  - name: task\n    description: Emergent and manual task creation, status, and output\n  - name: skill\n    description: Skill discovery and management\n  - name: scheduled\n    description: Manual recurring/cron task registration\n  - name: websocket\n    description: Real-time push events to connected clients\n\npaths:\n  /api/workspaces:\n    post:\n      tags: [workspace]\n      summary: Create a new workspace\n      operationId: createWorkspace\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/WorkspaceCreateRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Workspace created\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Workspace\&quot;\n        \&quot;400\&quot;:\n          description: Invalid request (e.g., duplicate name)\n        \&quot;409\&quot;:\n          description: Workspace already exists\n\n    get:\n      tags: [workspace]\n      summary: List all workspaces\n      operationId: listWorkspaces\n      responses:\n        \&quot;200\&quot;:\n          description: List of workspaces\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/Workspace\&quot;\n\n  /api/workspaces/{name}:\n    get:\n      tags: [workspace]\n      summary: Get workspace details\n      operationId: getWorkspace\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;200\&quot;:\n          description: Workspace details\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Workspace\&quot;\n        \&quot;404\&quot;:\n          description: Workspace not found\n\n    patch:\n      tags: [workspace]\n      summary: Update workspace definition (partial update)\n      operationId: updateWorkspace\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      requestBody:\n        required: false\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/WorkspaceUpdateRequest\&quot;\n      responses:\n        \&quot;200\&quot;:\n          description: Workspace updated\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Workspace\&quot;\n        \&quot;404\&quot;:\n          description: Workspace not found\n\n    delete:\n      tags: [workspace]\n      summary: Delete a workspace\n      operationId: deleteWorkspace\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;204\&quot;:\n          description: Workspace deleted\n        \&quot;404\&quot;:\n          description: Workspace not found\n\n  /api/sessions:\n    get:\n      tags: [session]\n      summary: List active sessions\n      operationId: listSessions\n      responses:\n        \&quot;200\&quot;:\n          description: List of sessions\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/Session\&quot;\n\n    post:\n      tags: [session]\n      summary: Create a new session for a workspace\n      operationId: createSession\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SessionCreateRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Session created\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Session\&quot;\n\n  /api/sessions/{id}:\n    get:\n      tags: [session]\n      summary: Get session status and details\n      operationId: getSession\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;200\&quot;:\n          description: Session status and details\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/SessionStatus\&quot;\n        \&quot;404\&quot;:\n          description: Session not found\n    post:\n      tags: [session]\n      summary: Send a message to an active session (chat input)\n      operationId: sendMessage\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SendMessageRequest\&quot;\n      responses:\n        \&quot;200\&quot;:\n          description: Agent response (structured)\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/AgentResponse\&quot;\n        \&quot;400\&quot;:\n          description: Invalid request\n        \&quot;404\&quot;:\n          description: Session not found or inactive\n\n    delete:\n      tags: [session]\n      summary: Delete a session\n      operationId: deleteSession\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;204\&quot;:\n          description: Session deleted\n\n  /api/sessions/{id}/history:\n    get:\n      tags: [session]\n      summary: Get conversation history turns for a session\n      operationId: sessionHistory\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n        - name: limit\n          in: query\n          schema:\n            type: integer\n            default: 10\n            minimum: 1\n      responses:\n        \&quot;200\&quot;:\n          description: List of conversation turns (most recent N)\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/SessionTurn\&quot;\n\n  /api/sessions/archive:\n    post:\n      tags: [session]\n      summary: Archive a session's task data for long-term storage\n      operationId: archiveSession\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/ArchiveSessionRequest\&quot;\n      responses:\n        \&quot;204\&quot;:\n          description: Session archived successfully\n        \&quot;404\&quot;:\n          description: Task not found\n\n  /api/notifications:\n    get:\n      tags: [notification]\n      summary: List notification entries\n      operationId: listNotifications\n      responses:\n        \&quot;200\&quot;:\n          description: List of notifications\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/NotificationEntry\&quot;\n\n    post:\n      tags: [notification]\n      summary: Create a new notification\n      operationId: createNotification\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/NotificationCreateRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Notification created\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  id:\n                    type: integer\n                    format: int64\n                  title:\n                    type: string\n                  severity:\n                    type: string\n\n  /api/notifications/{id}:\n    delete:\n      tags: [notification]\n      summary: Delete a notification entry\n      operationId: deleteNotification\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;204\&quot;:\n          description: Notification deleted\n\n  /api/tasks:\n    post:\n      tags: [task]\n      summary: Create a new task (internal agent use)\n      operationId: createTask\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/TaskCreateRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Task created and started\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Task\&quot;\n\n    get:\n      tags: [task]\n      summary: List active and scheduled (manual + emergent) tasks\n      operationId: listTasks\n      parameters:\n        - name: status\n          in: query\n          schema:\n            type: string\n            enum: [running, completed, failed, scheduled, cancelled]\n      responses:\n        \&quot;200\&quot;:\n          description: List of tasks\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/Task\&quot;\n\n  /api/tasks/{id}:\n    get:\n      tags: [task]\n      summary: Get task status and details\n      operationId: getTask\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;200\&quot;:\n          description: Task details\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Task\&quot;\n        \&quot;404\&quot;:\n          description: Task not found\n\n  /api/tasks/{id}/log:\n    get:\n      tags: [task]\n      summary: Tail task output (for CLI polling, both emergent and manual tasks)\n      operationId: tailTaskLog\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n        - name: lines\n          in: query\n          schema:\n            type: integer\n            default: 50\n      responses:\n        \&quot;200\&quot;:\n          description: Task log output\n          content:\n            text/plain:\n              schema:\n                type: string\n\n  /api/skills:\n    get:\n      tags: [skill]\n      summary: List discovered skills (metadata only)\n      operationId: listSkills\n      responses:\n        \&quot;200\&quot;:\n          description: List of discovered skills\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/Skill\&quot;\n\n  /api/skills/paths:\n    post:\n      tags: [skill]\n      summary: Add discovery paths for skill scanning (replaces legacy /install)\n      operationId: addDiscoveryPaths\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SkillInstallRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Discovery paths added\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  added:\n                    type: integer\n                  paths:\n                    type: array\n                    items:\n                      type: string\n\n  /api/skills/upload:\n    post:\n      tags: [skill]\n      summary: Upload skill files to the server's skills directory\n      operationId: uploadSkill\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SkillUploadRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Skill files uploaded and registered\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  installed:\n                    type: boolean\n                  path:\n                    type: string\n                    description: Server-side path where skill was written\n\n  /api/skills/install:\n    post:\n      tags: [skill]\n      summary: Install a skill from a git repository via graphify install --platform agents\n      operationId: installSkill\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SkillInstallRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Skill installed from git repo and registered\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  installed:\n                    type: boolean\n                  path:\n                    type: string\n                    description: Server-side path where skill was installed\n\n  /api/skills/{name}:\n    delete:\n      tags: [skill]\n      summary: Remove a skill\n      operationId: removeSkill\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;204\&quot;:\n          description: Skill removed\n\n    put:\n      tags: [skill]\n      summary: Update a skill from its source repository\n      operationId: updateSkill\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/SkillUpdateRequest\&quot;\n      responses:\n        \&quot;200\&quot;:\n          description: Skill updated successfully\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/SkillEntry\&quot;\n\n  /api/skills/{name}/check-version:\n    get:\n      tags: [skill]\n      summary: Check if a skill has an update available from its source URL\n      operationId: checkSkillVersion\n      parameters:\n        - name: name\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \&quot;200\&quot;:\n          description: Update availability check result\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/SkillVersionCheck\&quot;\n        \&quot;404\&quot;:\n          description: Skill not found\n\n  /api/tasks/scheduled:\n    get:\n      tags: [scheduled]\n      summary: List scheduled tasks\n      operationId: listScheduledTasks\n      responses:\n        \&quot;200\&quot;:\n          description: List of scheduled tasks\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \&quot;#/components/schemas/ScheduledTask\&quot;\n\n  /api/tasks/defer:\n    post:\n      tags: [task]\n      summary: Defer a task to run at an absolute time (one-shot)\n      operationId: deferTask\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/DeferTaskRequest\&quot;\n      responses:\n        \&quot;201\&quot;:\n          description: Task deferred successfully\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/Task\&quot;\n\n  /api/tasks/{id}/complete:\n    post:\n      tags: [task]\n      summary: Report task completion (internal)\n      operationId: reportTaskComplete\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: \&quot;#/components/schemas/TaskCompletion\&quot;\n      responses:\n        \&quot;200\&quot;:\n          description: Task completion acknowledged\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  status:\n                    type: string\n                  message:\n                    type: string\n\n  /health:\n    get:\n      tags: [system]\n      summary: Health check with scheduler status\n      operationId: healthCheck\n      responses:\n        \&quot;200\&quot;:\n          description: Service healthy\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/HealthStatus\&quot;\n\n  /api/config:\n    get:\n      tags: [system]\n      summary: Get system configuration (with optional workspace merge)\n      operationId: getConfig\n      parameters:\n        - name: workspace_id\n          in: query\n          schema:\n            type: string\n            description: If provided, returns merged per-workspace config\n      responses:\n        \&quot;200\&quot;:\n          description: System configuration returned\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/SystemConfig\&quot;\n    put:\n      tags: [system]\n      summary: Update system configuration (partial update)\n      operationId: putConfig\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              additionalProperties: true\n      responses:\n        \&quot;200\&quot;:\n          description: Configuration updated\n\n  /ws:\n    get:\n      tags: [websocket]\n      summary: WebSocket endpoint for real-time push events\n      operationId: connectWebSocket\n      responses:\n        \&quot;101\&quot;:\n          description: WebSocket upgrade successful\n          content:\n            application/json:\n              schema:\n                $ref: \&quot;#/components/schemas/WebSocketEvent\&quot;\n\ncomponents:\n  schemas:\n    WorkspaceCreateRequest:\n      type: object\n      required: [name, path]\n      properties:\n        name:\n          type: string\n          description: Unique workspace identifier\n          example: \&quot;my-project\&quot;\n        path:\n          type: string\n          description: Absolute path to the workspace directory\n          example: \&quot;/home/user/projects/my-project\&quot;\n        purpose:\n          type: string\n          description: The problem or domain this workspace addresses\n          example: \&quot;API migration for X service\&quot;\n        scope:\n          type: array\n          items:\n            type: string\n          description: Subsystems, repos, or services under this workspace\n          example: [\&quot;api-gateway\&quot;, \&quot;user-service\&quot;]\n        tags:\n          type: array\n          items:\n            type: string\n          description: Domain keywords for skill activation matching\n          example: [\&quot;grpc\&quot;, \&quot;migration\&quot;, \&quot;backend\&quot;]\n\n    WorkspaceUpdateRequest:\n      type: object\n      properties:\n        purpose:\n          type: string\n          description: The problem or domain this workspace addresses\n          example: \&quot;API migration for X service\&quot;\n        scope:\n          type: array\n          items:\n            type: string\n          description: Subsystems, repos, or services under this workspace\n          example: [\&quot;api-gateway\&quot;, \&quot;user-service\&quot;]\n        tags:\n          type: array\n          items:\n            type: string\n          description: Domain keywords for skill activation matching\n          example: [\&quot;grpc\&quot;, \&quot;migration\&quot;, \&quot;backend\&quot;]\n\n    Workspace:\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n          description: Unique workspace identifier\n        name:\n          type: string\n        path:\n          type: string\n        purpose:\n          type: string\n          description: The problem or domain this workspace addresses\n        scope:\n          type: array\n          items:\n            type: string\n          description: Subsystems, repos, or services under this workspace\n        tags:\n          type: array\n          items:\n            type: string\n          description: Domain keywords for skill activation matching\n        created_at:\n          type: string\n          format: date-time\n        updated_at:\n          type: string\n          format: date-time\n        status:\n          type: string\n          enum: [active, archived]\n\n    SessionCreateRequest:\n      type: object\n      required: [workspace_id]\n      properties:\n        workspace_id:\n          type: string\n          description: ID of the workspace to create session for\n        client_type:\n          type: string\n          enum: [cli, web_ui, custom]\n          default: \&quot;cli\&quot;\n\n    Session:\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n        name:\n          type: string\n          description: Human-readable session name\n        workspace_id:\n          type: string\n        status:\n          x-go-name: SessionStatus\n          type: string\n          enum: [active, inactive, crashed, recovered]\n        created_at:\n          type: string\n          format: date-time\n\n    TaskCreateRequest:\n      type: object\n      properties:\n        workspace_id:\n          type: string\n          description: Target workspace for this task\n        session_id:\n          type: string\n          description: Target session for this task\n        prompt:\n          type: string\n          description: Natural language task description\n        priority:\n          type: string\n          enum: [low, normal, high]\n          description: Task execution priority\n          default: \&quot;normal\&quot;\n\n    Task:\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n        workspace_id:\n          type: string\n        status:\n          type: string\n          enum: [pending, running, completed, failed, cancelled, scheduled]\n        prompt:\n          type: string\n        created_at:\n          type: string\n          format: date-time\n        completed_at:\n          type: string\n          format: date-time\n          nullable: true\n        duration_ms:\n          type: integer\n          description: Execution time in milliseconds\n        output_path:\n          type: string\n          description: Path to task output file (if applicable)\n        error:\n          type: string\n          nullable: true\n        retry_count:\n          type: integer\n          default: 0\n\n    SendMessageRequest:\n      type: object\n      required: [message]\n      properties:\n        message:\n          type: string\n          description: User message to send to the agent\n        attach_tools:\n          type: boolean\n          default: true\n          description: Whether to allow tool use in response\n\n    AgentResponse:\n      type: object\n      properties:\n        session_id:\n          type: string\n          format: uuid\n          description: Session ID that processed the message\n        response:\n          type: string\n          description: Agent's text response\n        tools_used:\n          type: array\n          items:\n            type: string\n          description: List of tool names invoked\n        task_created:\n          type: boolean\n          description: Whether an emergent task was created\n        task_id:\n          type: string\n          format: uuid\n          nullable: true\n          description: ID of newly created task (if task_created is true)\n        token_usage:\n          $ref: \&quot;#/components/schemas/TokenUsage\&quot;\n\n    SessionStatus:\n      x-go-name: SessionDetail\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n          description: Session identifier\n        name:\n          type: string\n          description: Human-readable session name\n        workspace_id:\n          type: string\n        status:\n          type: string\n          enum: [active, inactive, crashed, recovered]\n        created_at:\n          type: string\n          format: date-time\n        last_message_at:\n          type: string\n          format: date-time\n          nullable: true\n          description: Timestamp of the last message sent to this session\n        token_budget_used:\n          type: integer\n          description: Tokens consumed in current session\n        token_budget_remaining:\n          type: integer\n          description: Remaining tokens in budget\n        active_skills:\n          type: array\n          items:\n            type: string\n          description: Currently activated skills\n\n    TokenUsage:\n      type: object\n      properties:\n        prompt_tokens:\n          type: integer\n        completion_tokens:\n          type: integer\n        total_tokens:\n          type: integer\n\n    TaskCompletion:\n      type: object\n      required: [task_id, status]\n      properties:\n        task_id:\n          type: string\n        status:\n          type: string\n          enum: [completed, failed]\n        duration_ms:\n          type: integer\n        output_path:\n          type: string\n          nullable: true\n        error:\n          type: string\n          nullable: true\n        retry_count:\n          type: integer\n          default: 0\n        metadata:\n          type: object\n          additionalProperties: true\n          description: Arbitrary task-specific metadata\n\n    SkillEntry:\n      type: object\n      properties:\n        name:\n          type: string\n          description: Unique skill identifier\n        description:\n          type: string\n          description: Human-readable skill description\n        path:\n          type: string\n          description: Absolute filesystem path to the skill directory\n        tools:\n          type: array\n          items:\n            type: string\n          description: List of tool names provided by this skill\n        activation:\n          type: string\n          enum: [manual, auto, on-demand]\n          description: Activation mode — manual (user requests), auto (matches task keywords), on-demand (lazy load)\n        mcp_endpoint:\n          type: string\n          description: Optional MCP server endpoint URI for this skill\n        mcp_capabilities:\n          type: array\n          items:\n            type: string\n          description: List of MCP capabilities advertised by the skill's endpoint\n        dependencies:\n          type: array\n          items:\n            type: string\n          description: Pip packages to install before activation\n        source_url:\n          type: string\n          description: Git repository URL this skill was installed from\n        version:\n          type: string\n          description: Git tag/branch/commit SHA this skill is pinned to\n\n    Skill:\n      type: object\n      properties:\n        name:\n          type: string\n        version:\n          type: string\n        description:\n          type: string\n        tools:\n          type: array\n          items:\n            $ref: \&quot;#/components/schemas/SkillTool\&quot;\n\n    SkillTool:\n      type: object\n      properties:\n        type:\n          type: string\n          enum: [built-in, mcp]\n        name:\n          type: string\n        args:\n          type: array\n          items:\n            type: string\n          nullable: true\n        endpoint:\n          type: string\n          nullable: true\n          description: MCP endpoint URL (for mcp type)\n        capabilities:\n          type: array\n          items:\n            type: string\n          nullable: true\n\n    SkillInstallRequest:\n      type: object\n      required: [repo]\n      properties:\n        name:\n          type: string\n          description: Display name for the skill in the registry (defaults to repo basename if omitted)\n        repo:\n          type: string\n          description: Git repository URL to clone (e.g., \&quot;https://github.com/user/skill-repo\&quot;)\n        version:\n          type: string\n          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)\n\n    SkillUpdateRequest:\n      type: object\n      required: [repo]\n      properties:\n        repo:\n          type: string\n          description: Git repository URL to clone for update (e.g., \&quot;https://github.com/user/skill-repo\&quot;)\n        version:\n          type: string\n          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)\n\n    SkillUploadRequest:\n      type: object\n      required: [name, files]\n      properties:\n        name:\n          type: string\n          description: Skill name for registry (used as directory name)\n        files:\n          type: array\n          items:\n            $ref: \&quot;#/components/schemas/SkillFile\&quot;\n\n    SkillFile:\n      type: object\n      required: [name, content]\n      properties:\n        name:\n          type: string\n          description: Relative file path within the skill directory (e.g., \&quot;SKILL.md\&quot;, \&quot;references/query.md\&quot;)\n        content:\n          type: string\n          description: File contents as a string (UTF-8)\n\n    SkillVersionCheck:\n      type: object\n      properties:\n        name:\n          type: string\n          description: Skill name\n        installed_version:\n          type: string\n          description: Currently installed version (tag/branch/commit SHA)\n        has_update:\n          type: boolean\n          description: Whether a newer version is available on the source URL\n        latest_version:\n          type: string\n          description: Latest available version from remote source\n\n    ScheduledTaskRequest:\n      type: object\n      required: [name, workspace_id, schedule, skill]\n      properties:\n        name:\n          type: string\n        workspace_id:\n          type: string\n        schedule:\n          type: string\n          description: Cron expression (5-field or 6-field)\n          example: \&quot;*/5 * * * *\&quot;\n        skill:\n          type: string\n        activation_command:\n          type: string\n          description: \&quot;Optional command to run before task execution (e.g., skill activation script)\&quot;\n        config:\n          type: object\n          additionalProperties: true\n        on_success:\n          $ref: \&quot;#/components/schemas/NotificationConfig\&quot;\n        on_failure:\n          $ref: \&quot;#/components/schemas/NotificationConfig\&quot;\n\n    ScheduledTask:\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n        name:\n          type: string\n        workspace_id:\n          type: string\n        schedule:\n          type: string\n        skill:\n          type: string\n        activation_command:\n          type: string\n          description: \&quot;Optional command to run before task execution (e.g., skill activation script)\&quot;\n        status:\n          type: string\n          enum: [active, paused, failed]\n\n    DeferTaskRequest:\n      type: object\n      properties:\n        name:\n          type: string\n          description: Task name\n        command:\n          type: string\n          description: Shell command to execute when the task fires\n        defer_until:\n          type: string\n          format: date-time\n          description: Absolute time at which the task should run (RFC3339)\n        workspace_id:\n          type: string\n          description: Target workspace for this task\n\n    NotificationConfig:\n      type: object\n      properties:\n        channel:\n          type: string\n          description: Target channel (e.g., \&quot;slack\&quot;, \&quot;#ops\&quot;)\n        priority:\n          type: string\n          enum: [normal, high]\n          default: \&quot;normal\&quot;\n\n    WebSocketEvent:\n      type: object\n      required: [event]\n      properties:\n        event:\n          type: string\n          enum:\n            - task_progress\n            - task_complete\n            - task_failed\n            - notification\n            - session_event\n            - session_compressed\n            - context_budget_warning\n            - user_response\n        task_id:\n          type: string\n          nullable: true\n        session_id:\n          type: string\n          nullable: true\n        message:\n          type: string\n          nullable: true\n        step:\n          type: integer\n          nullable: true\n        channel:\n          type: string\n          nullable: true\n        priority:\n          type: string\n          enum: [normal, high]\n          nullable: true\n        used_tokens:\n          type: integer\n          nullable: true\n        remaining_tokens:\n          type: integer\n          nullable: true\n        threshold:\n          type: string\n          nullable: true\n          description: Budget threshold that triggered the event (e.g., \&quot;75%\&quot;)\n\n    ArchiveSessionRequest:\n      type: object\n      required: [task_id]\n      properties:\n        task_id:\n          type: string\n          description: ID of the task to archive\n\n    NotificationEntry:\n      type: object\n      properties:\n        id:\n          type: string\n          nullable: true\n        task_id:\n          type: string\n          nullable: true\n        title:\n          type: string\n          nullable: true\n        body:\n          type: string\n          nullable: true\n        severity:\n          type: string\n          nullable: true\n        created_at:\n          type: string\n          format: date-time\n          nullable: true\n\n    SessionTurn:\n      type: object\n      properties:\n        role:\n          type: string\n          enum: [user, assistant, system]\n        content:\n          type: string\n        timestamp:\n          type: string\n          format: date-time\n          nullable: true\n\n    HealthStatus:\n      type: object\n      required: [status]\n      properties:\n        status:\n          type: string\n          enum: [healthy, degraded]\n        scheduler:\n          $ref: \&quot;#/components/schemas/SchedulerStatus\&quot;\n        uptime_seconds:\n          type: integer\n          description: Service uptime in seconds\n\n    SchedulerStatus:\n      type: object\n      properties:\n        registered_tasks:\n          type: integer\n          description: Number of registered scheduled tasks\n        last_tick:\n          type: string\n          format: date-time\n          nullable: true\n          description: Time of the last scheduler tick\n\n    NotificationCreateRequest:\n      type: object\n      required: [title, body, severity]\n      properties:\n        title:\n          type: string\n          description: Notification title\n        body:\n          type: string\n          description: Notification body text\n        severity:\n          type: string\n        task_id:\n          type: string\n          description: Optional task ID to associate with this notification\n\n    SystemConfig:\n      type: object\n      description: Full system configuration including server, skills, notifications, and OpenShell settings\n      properties:\n        default_model:\n          type: string\n          description: Default LLM model name\n        server_port:\n          type: integer\n          description: HTTP server port number\n        host:\n          type: string\n          description: Bind address (e.g., \&quot;127.0.0.1\&quot;)\n        skills:\n          $ref: \&quot;#/components/schemas/SkillsConfig\&quot;\n        notify:\n          $ref: \&quot;#/components/schemas/NotifyConfig\&quot;\n        logging:\n          type: object\n          properties:\n            level:\n              type: string\n              description: Log level (debug, info, warn, error)\n        temperature:\n          type: number\n          format: float\n          description: Global default temperature (0 = use model default)\n        max_tokens:\n          type: integer\n          description: Global default max tokens (0 = use system default)\n        openshell:\n          $ref: \&quot;#/components/schemas/OpenShellConfig\&quot;\n\n    SkillsConfig:\n      type: object\n      properties:\n        discovery_paths:\n          type: array\n          items:\n            type: string\n          description: Paths to scan for SKILL.md files\n        max_active:\n          type: integer\n          description: Max concurrent active skills (0 = unlimited)\n\n    NotifyConfig:\n      type: object\n      properties:\n        bell_enabled:\n          type: boolean\n          description: Enable desktop notification bell\n        rate_limit_per_min:\n          type: integer\n          description: Maximum notifications per minute\n\n    OpenShellConfig:\n      type: object\n      properties:\n        address:\n          type: string\n          description: OpenShell gateway address\n        mtls_cert:\n          type: string\n          description: mTLS client certificate path\n        mtls_key:\n          type: string\n          description: mTLS client key path\n\n    WorkspaceConfig:\n      type: object\n      properties:\n        base_dir:\n          type: string\n          description: Base directory for workspace files\n        model:\n          type: string\n          description: Per-workspace LLM model override (empty = system default)\n        max_tokens:\n          type: integer\n          description: Per-workspace token budget (0 = system default)\n        temperature:\n          type: number\n          format: float\n          description: Per-workspace temperature (0 = system default)\n        skill_overrides:\n          type: array\n          items:\n            type: string\n          description: Per-workspace skill activation list\n        system_prompt:\n          type: string\n          description: Per-workspace system prompt override\n\n    WorkspaceMap:\n      type: object\n      additionalProperties:\n        $ref: \&quot;#/components/schemas/WorkspaceConfig\&quot;\n      description: Map of workspace_id -\u003e WorkspaceConfig\n&quot;,&quot;pageTitle&quot;:&quot;Norman API Reference&quot;}">openapi: "3.1.0"
info:
  title: "Norman Agent Server API"
  description: |
    Client ↔ Agent Server communication protocol for the Norman agent system.
    Designed to drive code generation for client protocol libraries and server handlers.
  version: "0.2.0"
  contact:
    name: "norman project"

servers:
  - url: "http://localhost:8080"
    description: "Default Agent Server endpoint"

tags:
  - name: workspace
    description: Workspace lifecycle management
  - name: session
    description: Chat session management (messages, history, status)
  - name: task
    description: Emergent and manual task creation, status, and output
  - name: skill
    description: Skill discovery and management
  - name: scheduled
    description: Manual recurring/cron task registration
  - name: websocket
    description: Real-time push events to connected clients

paths:
  /api/workspaces:
    post:
      tags: [workspace]
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request (e.g., duplicate name)
        "409":
          description: Workspace already exists

    get:
      tags: [workspace]
      summary: List all workspaces
      operationId: listWorkspaces
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"

  /api/workspaces/{name}:
    get:
      tags: [workspace]
      summary: Get workspace details
      operationId: getWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found

    patch:
      tags: [workspace]
      summary: Update workspace definition (partial update)
      operationId: updateWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found

    delete:
      tags: [workspace]
      summary: Delete a workspace
      operationId: deleteWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Workspace deleted
        "404":
          description: Workspace not found

  /api/sessions:
    get:
      tags: [session]
      summary: List active sessions
      operationId: listSessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

    post:
      tags: [session]
      summary: Create a new session for a workspace
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /api/sessions/{id}:
    get:
      tags: [session]
      summary: Get session status and details
      operationId: getSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status and details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "404":
          description: Session not found
    post:
      tags: [session]
      summary: Send a message to an active session (chat input)
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Agent response (structured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid request
        "404":
          description: Session not found or inactive

    delete:
      tags: [session]
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted

  /api/sessions/{id}/history:
    get:
      tags: [session]
      summary: Get conversation history turns for a session
      operationId: sessionHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
      responses:
        "200":
          description: List of conversation turns (most recent N)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionTurn"

  /api/sessions/archive:
    post:
      tags: [session]
      summary: Archive a session's task data for long-term storage
      operationId: archiveSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveSessionRequest"
      responses:
        "204":
          description: Session archived successfully
        "404":
          description: Task not found

  /api/notifications:
    get:
      tags: [notification]
      summary: List notification entries
      operationId: listNotifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationEntry"

    post:
      tags: [notification]
      summary: Create a new notification
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreateRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  title:
                    type: string
                  severity:
                    type: string

  /api/notifications/{id}:
    delete:
      tags: [notification]
      summary: Delete a notification entry
      operationId: deleteNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification deleted

  /api/tasks:
    post:
      tags: [task]
      summary: Create a new task (internal agent use)
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Task created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    get:
      tags: [task]
      summary: List active and scheduled (manual + emergent) tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [running, completed, failed, scheduled, cancelled]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /api/tasks/{id}:
    get:
      tags: [task]
      summary: Get task status and details
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found

  /api/tasks/{id}/log:
    get:
      tags: [task]
      summary: Tail task output (for CLI polling, both emergent and manual tasks)
      operationId: tailTaskLog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Task log output
          content:
            text/plain:
              schema:
                type: string

  /api/skills:
    get:
      tags: [skill]
      summary: List discovered skills (metadata only)
      operationId: listSkills
      responses:
        "200":
          description: List of discovered skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /api/skills/paths:
    post:
      tags: [skill]
      summary: Add discovery paths for skill scanning (replaces legacy /install)
      operationId: addDiscoveryPaths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "201":
          description: Discovery paths added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  paths:
                    type: array
                    items:
                      type: string

  /api/skills/upload:
    post:
      tags: [skill]
      summary: Upload skill files to the server's skills directory
      operationId: uploadSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUploadRequest"
      responses:
        "201":
          description: Skill files uploaded and registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  path:
                    type: string
                    description: Server-side path where skill was written

  /api/skills/install:
    post:
      tags: [skill]
      summary: Install a skill from a git repository via graphify install --platform agents
      operationId: installSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "201":
          description: Skill installed from git repo and registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  path:
                    type: string
                    description: Server-side path where skill was installed

  /api/skills/{name}:
    delete:
      tags: [skill]
      summary: Remove a skill
      operationId: removeSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Skill removed

    put:
      tags: [skill]
      summary: Update a skill from its source repository
      operationId: updateSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdateRequest"
      responses:
        "200":
          description: Skill updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillEntry"

  /api/skills/{name}/check-version:
    get:
      tags: [skill]
      summary: Check if a skill has an update available from its source URL
      operationId: checkSkillVersion
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Update availability check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillVersionCheck"
        "404":
          description: Skill not found

  /api/tasks/scheduled:
    get:
      tags: [scheduled]
      summary: List scheduled tasks
      operationId: listScheduledTasks
      responses:
        "200":
          description: List of scheduled tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledTask"

  /api/tasks/defer:
    post:
      tags: [task]
      summary: Defer a task to run at an absolute time (one-shot)
      operationId: deferTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeferTaskRequest"
      responses:
        "201":
          description: Task deferred successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{id}/complete:
    post:
      tags: [task]
      summary: Report task completion (internal)
      operationId: reportTaskComplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "200":
          description: Task completion acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /health:
    get:
      tags: [system]
      summary: Health check with scheduler status
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/config:
    get:
      tags: [system]
      summary: Get system configuration (with optional workspace merge)
      operationId: getConfig
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
            description: If provided, returns merged per-workspace config
      responses:
        "200":
          description: System configuration returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfig"
    put:
      tags: [system]
      summary: Update system configuration (partial update)
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Configuration updated

  /ws:
    get:
      tags: [websocket]
      summary: WebSocket endpoint for real-time push events
      operationId: connectWebSocket
      responses:
        "101":
          description: WebSocket upgrade successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketEvent"

components:
  schemas:
    WorkspaceCreateRequest:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Unique workspace identifier
          example: "my-project"
        path:
          type: string
          description: Absolute path to the workspace directory
          example: "/home/user/projects/my-project"
        purpose:
          type: string
          description: The problem or domain this workspace addresses
          example: "API migration for X service"
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
          example: ["api-gateway", "user-service"]
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
          example: ["grpc", "migration", "backend"]

    WorkspaceUpdateRequest:
      type: object
      properties:
        purpose:
          type: string
          description: The problem or domain this workspace addresses
          example: "API migration for X service"
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
          example: ["api-gateway", "user-service"]
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
          example: ["grpc", "migration", "backend"]

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique workspace identifier
        name:
          type: string
        path:
          type: string
        purpose:
          type: string
          description: The problem or domain this workspace addresses
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, archived]

    SessionCreateRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          description: ID of the workspace to create session for
        client_type:
          type: string
          enum: [cli, web_ui, custom]
          default: "cli"

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable session name
        workspace_id:
          type: string
        status:
          x-go-name: SessionStatus
          type: string
          enum: [active, inactive, crashed, recovered]
        created_at:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      properties:
        workspace_id:
          type: string
          description: Target workspace for this task
        session_id:
          type: string
          description: Target session for this task
        prompt:
          type: string
          description: Natural language task description
        priority:
          type: string
          enum: [low, normal, high]
          description: Task execution priority
          default: "normal"

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, scheduled]
        prompt:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          description: Execution time in milliseconds
        output_path:
          type: string
          description: Path to task output file (if applicable)
        error:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 0

    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message to send to the agent
        attach_tools:
          type: boolean
          default: true
          description: Whether to allow tool use in response

    AgentResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Session ID that processed the message
        response:
          type: string
          description: Agent's text response
        tools_used:
          type: array
          items:
            type: string
          description: List of tool names invoked
        task_created:
          type: boolean
          description: Whether an emergent task was created
        task_id:
          type: string
          format: uuid
          nullable: true
          description: ID of newly created task (if task_created is true)
        token_usage:
          $ref: "#/components/schemas/TokenUsage"

    SessionStatus:
      x-go-name: SessionDetail
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Session identifier
        name:
          type: string
          description: Human-readable session name
        workspace_id:
          type: string
        status:
          type: string
          enum: [active, inactive, crashed, recovered]
        created_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last message sent to this session
        token_budget_used:
          type: integer
          description: Tokens consumed in current session
        token_budget_remaining:
          type: integer
          description: Remaining tokens in budget
        active_skills:
          type: array
          items:
            type: string
          description: Currently activated skills

    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    TaskCompletion:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        duration_ms:
          type: integer
        output_path:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 0
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary task-specific metadata

    SkillEntry:
      type: object
      properties:
        name:
          type: string
          description: Unique skill identifier
        description:
          type: string
          description: Human-readable skill description
        path:
          type: string
          description: Absolute filesystem path to the skill directory
        tools:
          type: array
          items:
            type: string
          description: List of tool names provided by this skill
        activation:
          type: string
          enum: [manual, auto, on-demand]
          description: Activation mode — manual (user requests), auto (matches task keywords), on-demand (lazy load)
        mcp_endpoint:
          type: string
          description: Optional MCP server endpoint URI for this skill
        mcp_capabilities:
          type: array
          items:
            type: string
          description: List of MCP capabilities advertised by the skill's endpoint
        dependencies:
          type: array
          items:
            type: string
          description: Pip packages to install before activation
        source_url:
          type: string
          description: Git repository URL this skill was installed from
        version:
          type: string
          description: Git tag/branch/commit SHA this skill is pinned to

    Skill:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/SkillTool"

    SkillTool:
      type: object
      properties:
        type:
          type: string
          enum: [built-in, mcp]
        name:
          type: string
        args:
          type: array
          items:
            type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
          description: MCP endpoint URL (for mcp type)
        capabilities:
          type: array
          items:
            type: string
          nullable: true

    SkillInstallRequest:
      type: object
      required: [repo]
      properties:
        name:
          type: string
          description: Display name for the skill in the registry (defaults to repo basename if omitted)
        repo:
          type: string
          description: Git repository URL to clone (e.g., "https://github.com/user/skill-repo")
        version:
          type: string
          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)

    SkillUpdateRequest:
      type: object
      required: [repo]
      properties:
        repo:
          type: string
          description: Git repository URL to clone for update (e.g., "https://github.com/user/skill-repo")
        version:
          type: string
          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)

    SkillUploadRequest:
      type: object
      required: [name, files]
      properties:
        name:
          type: string
          description: Skill name for registry (used as directory name)
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillFile"

    SkillFile:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: Relative file path within the skill directory (e.g., "SKILL.md", "references/query.md")
        content:
          type: string
          description: File contents as a string (UTF-8)

    SkillVersionCheck:
      type: object
      properties:
        name:
          type: string
          description: Skill name
        installed_version:
          type: string
          description: Currently installed version (tag/branch/commit SHA)
        has_update:
          type: boolean
          description: Whether a newer version is available on the source URL
        latest_version:
          type: string
          description: Latest available version from remote source

    ScheduledTaskRequest:
      type: object
      required: [name, workspace_id, schedule, skill]
      properties:
        name:
          type: string
        workspace_id:
          type: string
        schedule:
          type: string
          description: Cron expression (5-field or 6-field)
          example: "*/5 * * * *"
        skill:
          type: string
        activation_command:
          type: string
          description: "Optional command to run before task execution (e.g., skill activation script)"
        config:
          type: object
          additionalProperties: true
        on_success:
          $ref: "#/components/schemas/NotificationConfig"
        on_failure:
          $ref: "#/components/schemas/NotificationConfig"

    ScheduledTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workspace_id:
          type: string
        schedule:
          type: string
        skill:
          type: string
        activation_command:
          type: string
          description: "Optional command to run before task execution (e.g., skill activation script)"
        status:
          type: string
          enum: [active, paused, failed]

    DeferTaskRequest:
      type: object
      properties:
        name:
          type: string
          description: Task name
        command:
          type: string
          description: Shell command to execute when the task fires
        defer_until:
          type: string
          format: date-time
          description: Absolute time at which the task should run (RFC3339)
        workspace_id:
          type: string
          description: Target workspace for this task

    NotificationConfig:
      type: object
      properties:
        channel:
          type: string
          description: Target channel (e.g., "slack", "#ops")
        priority:
          type: string
          enum: [normal, high]
          default: "normal"

    WebSocketEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum:
            - task_progress
            - task_complete
            - task_failed
            - notification
            - session_event
            - session_compressed
            - context_budget_warning
            - user_response
        task_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        step:
          type: integer
          nullable: true
        channel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [normal, high]
          nullable: true
        used_tokens:
          type: integer
          nullable: true
        remaining_tokens:
          type: integer
          nullable: true
        threshold:
          type: string
          nullable: true
          description: Budget threshold that triggered the event (e.g., "75%")

    ArchiveSessionRequest:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          description: ID of the task to archive

    NotificationEntry:
      type: object
      properties:
        id:
          type: string
          nullable: true
        task_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    SessionTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
          nullable: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        scheduler:
          $ref: "#/components/schemas/SchedulerStatus"
        uptime_seconds:
          type: integer
          description: Service uptime in seconds

    SchedulerStatus:
      type: object
      properties:
        registered_tasks:
          type: integer
          description: Number of registered scheduled tasks
        last_tick:
          type: string
          format: date-time
          nullable: true
          description: Time of the last scheduler tick

    NotificationCreateRequest:
      type: object
      required: [title, body, severity]
      properties:
        title:
          type: string
          description: Notification title
        body:
          type: string
          description: Notification body text
        severity:
          type: string
        task_id:
          type: string
          description: Optional task ID to associate with this notification

    SystemConfig:
      type: object
      description: Full system configuration including server, skills, notifications, and OpenShell settings
      properties:
        default_model:
          type: string
          description: Default LLM model name
        server_port:
          type: integer
          description: HTTP server port number
        host:
          type: string
          description: Bind address (e.g., "127.0.0.1")
        skills:
          $ref: "#/components/schemas/SkillsConfig"
        notify:
          $ref: "#/components/schemas/NotifyConfig"
        logging:
          type: object
          properties:
            level:
              type: string
              description: Log level (debug, info, warn, error)
        temperature:
          type: number
          format: float
          description: Global default temperature (0 = use model default)
        max_tokens:
          type: integer
          description: Global default max tokens (0 = use system default)
        openshell:
          $ref: "#/components/schemas/OpenShellConfig"

    SkillsConfig:
      type: object
      properties:
        discovery_paths:
          type: array
          items:
            type: string
          description: Paths to scan for SKILL.md files
        max_active:
          type: integer
          description: Max concurrent active skills (0 = unlimited)

    NotifyConfig:
      type: object
      properties:
        bell_enabled:
          type: boolean
          description: Enable desktop notification bell
        rate_limit_per_min:
          type: integer
          description: Maximum notifications per minute

    OpenShellConfig:
      type: object
      properties:
        address:
          type: string
          description: OpenShell gateway address
        mtls_cert:
          type: string
          description: mTLS client certificate path
        mtls_key:
          type: string
          description: mTLS client key path

    WorkspaceConfig:
      type: object
      properties:
        base_dir:
          type: string
          description: Base directory for workspace files
        model:
          type: string
          description: Per-workspace LLM model override (empty = system default)
        max_tokens:
          type: integer
          description: Per-workspace token budget (0 = system default)
        temperature:
          type: number
          format: float
          description: Per-workspace temperature (0 = system default)
        skill_overrides:
          type: array
          items:
            type: string
          description: Per-workspace skill activation list
        system_prompt:
          type: string
          description: Per-workspace system prompt override

    WorkspaceMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/WorkspaceConfig"
      description: Map of workspace_id -> WorkspaceConfig
</script>
        <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
      </body>
    </html>
