openapi: "3.1.0"
info:
  title: "Norman Agent Server API"
  description: |
    Client ↔ Agent Server communication protocol for the Norman agent system.
    Designed to drive code generation for client protocol libraries and server handlers.
  version: "0.2.0"
  contact:
    name: "norman project"

servers:
  - url: "http://localhost:8080"
    description: "Default Agent Server endpoint"

tags:
  - name: workspace
    description: Workspace lifecycle management
  - name: session
    description: Chat session management (messages, history, status)
  - name: task
    description: Emergent and manual task creation, status, and output
  - name: skill
    description: Skill discovery and management
  - name: scheduled
    description: Manual recurring/cron task registration
  - name: websocket
    description: Real-time push events to connected clients
  - name: provider
    description: LLM provider lifecycle management (add, list, update, remove)

paths:
  /api/workspaces:
    post:
      tags: [workspace]
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request (e.g., duplicate name)
        "409":
          description: Workspace already exists

    get:
      tags: [workspace]
      summary: List all workspaces (optionally filtered by status)
      operationId: listWorkspaces
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, stopped]
          description: Filter results by lifecycle state
        - name: idle_since
          in: query
          schema:
            type: string
            format: date-time
          description: Return workspaces that have been idle since this timestamp (RFC3339)
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"

  /api/workspaces/{name}:
    get:
      tags: [workspace]
      summary: Get workspace details
      operationId: getWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found

    patch:
      tags: [workspace]
      summary: Update workspace definition (partial update)
      operationId: updateWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found

    delete:
      tags: [workspace]
      summary: Delete a workspace
      operationId: deleteWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Workspace deleted
        "404":
          description: Workspace not found

  /api/workspaces/{name}/stop:
    post:
      tags: [workspace]
      summary: Stop a workspace (free sandbox, keep data)
      operationId: stopWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          description: Workspace stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found
        "409":
          description: Workspace is already stopped

  /api/workspaces/{name}/restore:
    post:
      tags: [workspace]
      summary: Restore a stopped/archived workspace to active
      operationId: restoreWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: Workspace restored to active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: Workspace not found
        "409":
          description: Workspace is already active

  /api/workspaces/{name}/purge:
    delete:
      tags: [workspace]
      summary: Permanently purge a workspace (deletes all traces)
      operationId: purgeWorkspace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "204":
          description: Workspace purged successfully
        "404":
          description: Workspace not found
        "400":
          description: Confirmation not provided (confirm must be true)

  /api/sessions:
    get:
      tags: [session]
      summary: List active sessions
      operationId: listSessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

    post:
      tags: [session]
      summary: Create a new session for a workspace
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /api/sessions/{id}:
    get:
      tags: [session]
      summary: Get session status and details
      operationId: getSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status and details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "404":
          description: Session not found
    post:
      tags: [session]
      summary: Send a message to an active session (chat input)
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Agent response (structured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid request
        "404":
          description: Session not found or inactive

    delete:
      tags: [session]
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted

  /api/sessions/{id}/debug:
    post:
      tags: [session]
      summary: Debug route to verify routing and session state
      operationId: sessionDebug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Debug information for the session
          content:
            text/plain:
              schema:
                type: string

  /api/sessions/{id}/messages:
    post:
      tags: [session]
      summary: Send a message to an active session (chat-first interface)
      operationId: sendSessionMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Agent response (structured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid request
        "404":
          description: Session not found or inactive

  /api/sessions/{id}/history:
    get:
      tags: [session]
      summary: Get conversation history turns for a session
      operationId: sessionHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
      responses:
        "200":
          description: List of conversation turns (most recent N)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionTurn"

  /api/sessions/archive:
    post:
      tags: [session]
      summary: Archive a session's task data for long-term storage
      operationId: archiveSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveSessionRequest"
      responses:
        "204":
          description: Session archived successfully
        "404":
          description: Task not found

  /api/notifications:
    get:
      tags: [notification]
      summary: List notification entries
      operationId: listNotifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationEntry"

    post:
      tags: [notification]
      summary: Create a new notification
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreateRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  title:
                    type: string
                  severity:
                    type: string

  /api/notifications/{id}:
    delete:
      tags: [notification]
      summary: Delete a notification entry
      operationId: deleteNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification deleted

  /api/tasks:
    post:
      tags: [task]
      summary: Create a new task (internal agent use)
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Task created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    get:
      tags: [task]
      summary: List active and scheduled (manual + emergent) tasks
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [running, completed, failed, scheduled, cancelled]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /api/tasks/{id}:
    get:
      tags: [task]
      summary: Get task status and details
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found

  /api/tasks/{id}/log:
    get:
      tags: [task]
      summary: Tail task output (for CLI polling, both emergent and manual tasks)
      operationId: tailTaskLog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Task log output
          content:
            text/plain:
              schema:
                type: string

  /api/skills:
    get:
      tags: [skill]
      summary: List discovered skills (metadata only)
      operationId: listSkills
      responses:
        "200":
          description: List of discovered skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /api/skills/paths:
    post:
      tags: [skill]
      summary: Add discovery paths for skill scanning (replaces legacy /install)
      operationId: addDiscoveryPaths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "201":
          description: Discovery paths added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  paths:
                    type: array
                    items:
                      type: string

  /api/skills/upload:
    post:
      tags: [skill]
      summary: Upload skill files to the server's skills directory
      operationId: uploadSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUploadRequest"
      responses:
        "201":
          description: Skill files uploaded and registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  path:
                    type: string
                    description: Server-side path where skill was written

  /api/skills/install:
    post:
      tags: [skill]
      summary: Install a skill from a git repository via graphify install --platform agents
      operationId: installSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInstallRequest"
      responses:
        "201":
          description: Skill installed from git repo and registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  path:
                    type: string
                    description: Server-side path where skill was installed

  /api/skills/{name}:
    delete:
      tags: [skill]
      summary: Remove a skill
      operationId: removeSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Skill removed

    put:
      tags: [skill]
      summary: Update a skill from its source repository
      operationId: updateSkill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdateRequest"
      responses:
        "200":
          description: Skill updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillEntry"

  /api/skills/{name}/check-version:
    get:
      tags: [skill]
      summary: Check if a skill has an update available from its source URL
      operationId: checkSkillVersion
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Update availability check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillVersionCheck"
        "404":
          description: Skill not found

  /api/tasks/scheduled:
    get:
      tags: [scheduled]
      summary: List scheduled tasks
      operationId: listScheduledTasks
      responses:
        "200":
          description: List of scheduled tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledTask"

  /api/tasks/defer:
    post:
      tags: [task]
      summary: Defer a task to run at an absolute time (one-shot)
      operationId: deferTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeferTaskRequest"
      responses:
        "201":
          description: Task deferred successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{id}/complete:
    post:
      tags: [task]
      summary: Report task completion (internal)
      operationId: reportTaskComplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "200":
          description: Task completion acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /health:
    get:
      tags: [system]
      summary: Health check with scheduler status
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/config:
    get:
      tags: [system]
      summary: Get system configuration (with optional workspace merge)
      operationId: getConfig
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
            description: If provided, returns merged per-workspace config
      responses:
        "200":
          description: System configuration returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfig"
    put:
      tags: [system]
      summary: Update system configuration (partial update)
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Configuration updated

  /ws:
    get:
      tags: [websocket]
      summary: WebSocket endpoint for real-time push events
      operationId: connectWebSocket
      responses:
        "101":
          description: WebSocket upgrade successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketEvent"

  /api/providers:
    get:
      tags: [provider]
      summary: List all configured LLM providers
      operationId: listProviders
      responses:
        "200":
          description: List of configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderResponse"

    post:
      tags: [provider]
      summary: Add a new LLM provider
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreateRequest"
      responses:
        "201":
          description: Provider created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "400":
          description: Invalid request (e.g., duplicate name, missing required fields)
        "409":
          description: Provider with this name already exists

  /api/providers/{name}:
    get:
      tags: [provider]
      summary: Get provider details by name
      operationId: getProvider
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "404":
          description: Provider not found

    put:
      tags: [provider]
      summary: Update an existing provider's configuration
      operationId: updateProvider
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdateRequest"
      responses:
        "200":
          description: Provider updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "400":
          description: Invalid request (e.g., invalid type, temperature out of range)
        "404":
          description: Provider not found

    delete:
      tags: [provider]
      summary: Remove a provider (cannot delete the last remaining one)
      operationId: deleteProvider
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Provider removed successfully
        "400":
          description: Cannot delete the last remaining provider
        "404":
          description: Provider not found

  /api/providers/{name}/models:
    get:
      tags: [provider]
      summary: List available models for a provider (queries the provider's API)
      operationId: listProviderModels
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of available models from the provider's API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableModelsResponse"
        "404":
          description: Provider not found
        "500":
          description: Failed to query provider's model list endpoint

  /api/providers/models/query:
    post:
      tags: [provider]
      summary: Query available models for a temporary provider configuration (no persistence)
      operationId: queryProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryProviderModelsRequest"
      responses:
        "200":
          description: List of available models from the provider's API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableModelsResponse"
        "400":
          description: Invalid request (e.g., missing type or endpoint)
        "500":
          description: Failed to query provider's model list endpoint

components:
  schemas:
    WorkspaceCreateRequest:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: Unique workspace identifier
          example: "my-project"
        path:
          type: string
          description: Absolute path to the workspace directory
          example: "/home/user/projects/my-project"
        purpose:
          type: string
          description: The problem or domain this workspace addresses
          example: "API migration for X service"
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
          example: ["api-gateway", "user-service"]
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
          example: ["grpc", "migration", "backend"]

    WorkspaceUpdateRequest:
      type: object
      properties:
        purpose:
          type: string
          description: The problem or domain this workspace addresses
          example: "API migration for X service"
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
          example: ["api-gateway", "user-service"]
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
          example: ["grpc", "migration", "backend"]

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique workspace identifier
        name:
          type: string
        path:
          type: string
        purpose:
          type: string
          description: The problem or domain this workspace addresses
        scope:
          type: array
          items:
            type: string
          description: Subsystems, repos, or services under this workspace
        tags:
          type: array
          items:
            type: string
          description: Domain keywords for skill activation matching
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, stopped]
          description: >
            Lifecycle state of the workspace. "active" = running sandbox;
            "stopped" = sandbox freed but data preserved (via snapshot).
        last_used:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last activity (session start, message sent, task created)

    # --- Workspace Lifecycle Transitions ---

    StopRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason for stopping (e.g., "idle timeout", "manual")

    RestoreRequest:
      type: object
      properties:
        recreate_sandbox:
          type: boolean
          default: true
          description: Whether to recreate the OpenShell sandbox on restore

    PurgeRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Explicit confirmation field (must be true to proceed)

    SessionCreateRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          description: ID of the workspace to create session for
        client_type:
          type: string
          enum: [cli, web_ui, custom]
          default: "cli"

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human-readable session name
        workspace_id:
          type: string
        status:
          x-go-name: SessionStatus
          type: string
          enum: [active, inactive, crashed, recovered]
        created_at:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      properties:
        workspace_id:
          type: string
          description: Target workspace for this task
        session_id:
          type: string
          description: Target session for this task
        prompt:
          type: string
          description: Natural language task description
        priority:
          type: string
          enum: [low, normal, high]
          description: Task execution priority
          default: "normal"

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, scheduled]
        prompt:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          description: Execution time in milliseconds
        output_path:
          type: string
          description: Path to task output file (if applicable)
        error:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 0

    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message to send to the agent
        attach_tools:
          type: boolean
          default: true
          description: Whether to allow tool use in response
        provider:
          type: string
          description: Optional provider name to override the workspace default

    AgentResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Session ID that processed the message
        response:
          type: string
          description: Agent's text response
        tools_used:
          type: array
          items:
            type: string
          description: List of tool names invoked
        task_created:
          type: boolean
          description: Whether an emergent task was created
        task_id:
          type: string
          format: uuid
          nullable: true
          description: ID of newly created task (if task_created is true)
        token_usage:
          $ref: "#/components/schemas/TokenUsage"

    SessionStatus:
      x-go-name: SessionDetail
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Session identifier
        name:
          type: string
          description: Human-readable session name
        workspace_id:
          type: string
        status:
          type: string
          enum: [active, inactive, crashed, recovered]
        created_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last message sent to this session
        token_budget_used:
          type: integer
          description: Tokens consumed in current session
        token_budget_remaining:
          type: integer
          description: Remaining tokens in budget
        active_skills:
          type: array
          items:
            type: string
          description: Currently activated skills

    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    TaskCompletion:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        duration_ms:
          type: integer
        output_path:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 0
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary task-specific metadata

    SkillEntry:
      type: object
      properties:
        name:
          type: string
          description: Unique skill identifier
        description:
          type: string
          description: Human-readable skill description
        path:
          type: string
          description: Absolute filesystem path to the skill directory
        tools:
          type: array
          items:
            type: string
          description: List of tool names provided by this skill
        activation:
          type: string
          enum: [manual, auto, on-demand]
          description: Activation mode — manual (user requests), auto (matches task keywords), on-demand (lazy load)
        mcp_endpoint:
          type: string
          description: Optional MCP server endpoint URI for this skill
        mcp_capabilities:
          type: array
          items:
            type: string
          description: List of MCP capabilities advertised by the skill's endpoint
        dependencies:
          type: array
          items:
            type: string
          description: Pip packages to install before activation
        source_url:
          type: string
          description: Git repository URL this skill was installed from
        version:
          type: string
          description: Git tag/branch/commit SHA this skill is pinned to

    Skill:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/SkillTool"

    SkillTool:
      type: object
      properties:
        type:
          type: string
          enum: [built-in, mcp]
        name:
          type: string
        args:
          type: array
          items:
            type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
          description: MCP endpoint URL (for mcp type)
        capabilities:
          type: array
          items:
            type: string
          nullable: true

    SkillInstallRequest:
      type: object
      required: [repo]
      properties:
        name:
          type: string
          description: Display name for the skill in the registry (defaults to repo basename if omitted)
        repo:
          type: string
          description: Git repository URL to clone (e.g., "https://github.com/user/skill-repo")
        version:
          type: string
          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)

    SkillUpdateRequest:
      type: object
      required: [repo]
      properties:
        repo:
          type: string
          description: Git repository URL to clone for update (e.g., "https://github.com/user/skill-repo")
        version:
          type: string
          description: Git tag, branch, or commit SHA to check out (defaults to default branch if omitted)

    SkillUploadRequest:
      type: object
      required: [name, files]
      properties:
        name:
          type: string
          description: Skill name for registry (used as directory name)
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillFile"

    SkillFile:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: Relative file path within the skill directory (e.g., "SKILL.md", "references/query.md")
        content:
          type: string
          description: File contents as a string (UTF-8)

    SkillVersionCheck:
      type: object
      properties:
        name:
          type: string
          description: Skill name
        installed_version:
          type: string
          description: Currently installed version (tag/branch/commit SHA)
        has_update:
          type: boolean
          description: Whether a newer version is available on the source URL
        latest_version:
          type: string
          description: Latest available version from remote source

    ScheduledTaskRequest:
      type: object
      required: [name, workspace_id, schedule, skill]
      properties:
        name:
          type: string
        workspace_id:
          type: string
        schedule:
          type: string
          description: Cron expression (5-field or 6-field)
          example: "*/5 * * * *"
        skill:
          type: string
        activation_command:
          type: string
          description: "Optional command to run before task execution (e.g., skill activation script)"
        config:
          type: object
          additionalProperties: true
        on_success:
          $ref: "#/components/schemas/NotificationConfig"
        on_failure:
          $ref: "#/components/schemas/NotificationConfig"

    ScheduledTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workspace_id:
          type: string
        schedule:
          type: string
        skill:
          type: string
        activation_command:
          type: string
          description: "Optional command to run before task execution (e.g., skill activation script)"
        status:
          type: string
          enum: [active, paused, failed]

    DeferTaskRequest:
      type: object
      properties:
        name:
          type: string
          description: Task name
        command:
          type: string
          description: Shell command to execute when the task fires
        defer_until:
          type: string
          format: date-time
          description: Absolute time at which the task should run (RFC3339)
        workspace_id:
          type: string
          description: Target workspace for this task

    NotificationConfig:
      type: object
      properties:
        channel:
          type: string
          description: Target channel (e.g., "slack", "#ops")
        priority:
          type: string
          enum: [normal, high]
          default: "normal"

    WebSocketEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum:
            - task_progress
            - task_complete
            - task_failed
            - notification
            - session_event
            - session_compressed
            - context_budget_warning
            - user_response
        task_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        step:
          type: integer
          nullable: true
        channel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [normal, high]
          nullable: true
        used_tokens:
          type: integer
          nullable: true
        remaining_tokens:
          type: integer
          nullable: true
        threshold:
          type: string
          nullable: true
          description: Budget threshold that triggered the event (e.g., "75%")

    ArchiveSessionRequest:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          description: ID of the task to archive

    NotificationEntry:
      type: object
      properties:
        id:
          type: string
          nullable: true
        task_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    SessionTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
          nullable: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        scheduler:
          $ref: "#/components/schemas/SchedulerStatus"
        uptime_seconds:
          type: integer
          description: Service uptime in seconds

    SchedulerStatus:
      type: object
      properties:
        registered_tasks:
          type: integer
          description: Number of registered scheduled tasks
        last_tick:
          type: string
          format: date-time
          nullable: true
          description: Time of the last scheduler tick

    NotificationCreateRequest:
      type: object
      required: [title, body, severity]
      properties:
        title:
          type: string
          description: Notification title
        body:
          type: string
          description: Notification body text
        severity:
          type: string
        task_id:
          type: string
          description: Optional task ID to associate with this notification

    SystemConfig:
      type: object
      description: Full system configuration including server, skills, notifications, and OpenShell settings
      properties:
        default_model:
          type: string
          description: Default LLM model name
        server_port:
          type: integer
          description: HTTP server port number
        host:
          type: string
          description: Bind address (e.g., "127.0.0.1")
        default_provider:
          type: string
          description: Name of the default LLM provider to use for sessions and CLI operations
        skills:
          $ref: "#/components/schemas/SkillsConfig"
        notify:
          $ref: "#/components/schemas/NotifyConfig"
        logging:
          type: object
          properties:
            level:
              type: string
              description: Log level (debug, info, warn, error)
        temperature:
          type: number
          format: float
          description: Global default temperature (0 = use model default)
        max_tokens:
          type: integer
          description: Global default max tokens (0 = use system default)
        openshell:
          $ref: "#/components/schemas/OpenShellConfig"

    SkillsConfig:
      type: object
      properties:
        discovery_paths:
          type: array
          items:
            type: string
          description: Paths to scan for SKILL.md files
        max_active:
          type: integer
          description: Max concurrent active skills (0 = unlimited)

    NotifyConfig:
      type: object
      properties:
        bell_enabled:
          type: boolean
          description: Enable desktop notification bell
        rate_limit_per_min:
          type: integer
          description: Maximum notifications per minute

    OpenShellConfig:
      type: object
      properties:
        address:
          type: string
          description: OpenShell gateway address
        mtls_cert:
          type: string
          description: mTLS client certificate path
        mtls_key:
          type: string
          description: mTLS client key path

    WorkspaceConfig:
      type: object
      properties:
        base_dir:
          type: string
          description: Base directory for workspace files
        model:
          type: string
          description: Per-workspace LLM model override (empty = system default)
        max_tokens:
          type: integer
          description: Per-workspace token budget (0 = system default)
        temperature:
          type: number
          format: float
          description: Per-workspace temperature (0 = system default)
        skill_overrides:
          type: array
          items:
            type: string
          description: Per-workspace skill activation list
        system_prompt:
          type: string
          description: Per-workspace system prompt override

    WorkspaceMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/WorkspaceConfig"
      description: Map of workspace_id -> WorkspaceConfig

    # --- Provider Schemas ---

    ProviderConfig:
      type: object
      required: [name, type, endpoint]
      properties:
        name:
          type: string
          description: Unique provider identifier (e.g., "default", "local-llama")
        type:
          type: string
          enum: [openai, anthropic, ollama, gemini, llamacpp]
          description: Provider implementation type
        endpoint:
          type: string
          format: uri
          description: Base API URL (e.g., "https://api.openai.com/v1")
        model:
          type: string
          description: Default model name for this provider
        temperature:
          type: number
          format: float
          description: Provider default temperature (0–2)
        max_tokens:
          type: integer
          minimum: 1
          description: Provider default max tokens per call
        api_key:
          type: string
          description: API key (masked in GET responses, required for openai/anthropic types)
        extra:
          type: object
          additionalProperties: true
          description: Type-specific fields (e.g., cache_size for llamacpp)

    ProviderCreateRequest:
      type: object
      required: [name, type, endpoint]
      properties:
        name:
          type: string
          description: Unique provider identifier
        type:
          type: string
          enum: [openai, anthropic, ollama, gemini, llamacpp]
          description: Provider implementation type
        endpoint:
          type: string
          format: uri
          description: Base API URL (e.g., "https://api.openai.com/v1")
        model:
          type: string
          description: Default model name for this provider
        temperature:
          type: number
          format: float
          description: Provider default temperature (0–2)
        max_tokens:
          type: integer
          minimum: 1
          description: Provider default max tokens per call
        api_key:
          type: string
          description: API key (required for openai/anthropic types)
        extra:
          type: object
          additionalProperties: true
          description: Type-specific fields (e.g., cache_size for llamacpp)

    ProviderUpdateRequest:
      type: object
      properties:
        type:
          type: string
          enum: [openai, anthropic, ollama, gemini, llamacpp]
          description: Provider implementation type
        endpoint:
          type: string
          format: uri
          description: Base API URL (e.g., "https://api.openai.com/v1")
        model:
          type: string
          description: Default model name for this provider
        temperature:
          type: number
          format: float
          description: Provider default temperature (0–2)
        max_tokens:
          type: integer
          minimum: 1
          description: Provider default max tokens per call
        api_key:
          type: string
          description: API key (required for openai/anthropic types when type is changed)
        extra:
          type: object
          additionalProperties: true
          description: Type-specific fields (e.g., cache_size for llamacpp)

    ProviderResponse:
      type: object
      properties:
        name:
          type: string
          description: Unique provider identifier
        type:
          type: string
          enum: [openai, anthropic, ollama, gemini, llamacpp]
          description: Provider implementation type
        endpoint:
          type: string
          description: Base API URL
        model:
          type: string
          description: Default model name for this provider
        temperature:
          type: number
          format: float
          description: Provider default temperature (0–2)
        max_tokens:
          type: integer
          description: Provider default max tokens per call
        api_key_masked:
          type: boolean
          description: true if api_key is non-empty (never returns raw key in GET responses)
        extra:
          type: object
          additionalProperties: true
          description: Type-specific fields (e.g., cache_size for llamacpp)

    AvailableModelEntry:
      type: object
      properties:
        id:
          type: string
          description: Model identifier (e.g., "gpt-4o", "llama3.1-8b")
        name:
          type: string
          description: Human-readable model name
        owned_by:
          type: string
          nullable: true
          description: Owner/creator of the model (e.g., "openai", "meta")

    QueryProviderModelsRequest:
      type: object
      required: [type, endpoint]
      properties:
        type:
          type: string
          description: Provider type (openai, anthropic, ollama, gemini, llamacpp)
        endpoint:
          type: string
          description: API endpoint URL
        api_key:
          type: string
          description: API key for authentication (optional)

    AvailableModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/AvailableModelEntry"
        provider_name:
          type: string
          description: Name of the provider queried
