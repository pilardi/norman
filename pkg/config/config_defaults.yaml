# Embedded default configuration for Norman.
# This file is compiled into the binary via go:embed and serves as the
# fallback when no ~/.norman/config.yaml exists.
# It is NOT user-modifiable — edits here require recompilation.

system:
  server_port: 8080
  host: "127.0.0.1"
  base_dir: "~/.norman/workspaces"
  open_shell:
    address: ""
  skills:
    discovery_paths:
      - "builtin://task-management"
      - "~/.norman/skills/"
      - "/usr/share/norman/skills/"
    max_active: 3
    path: "~/.norman/skills/"
  notify:
    bell_enabled: true
    slack_webhook: ""
    rate_limit_per_minute: 10
  logging:
    verbose: false
  llm_providers:
    - name: "local-llamacpp"
      type: "llamacpp"
      endpoint: "http://localhost:8288"
      model: "unsloth/Qwen3.8-27B-GGUF:IQ3_S"
      temperature: 0.7
      max_tokens: 55000
      api_key: "" # set your OpenAI key here (non-empty required for openai type)
      embedding_endpoint: "/embeddings" # optional: "/embeddings" or "/api/v1/embeddings"; leave empty for auto-detect
